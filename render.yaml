services:
  - type: web
    name: cockpit-pfs
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # En-têtes de sécurité. Pas de Content-Security-Policy ici :
    # une CSP stricte pourrait bloquer les appels vers l'API (VITE_API_URL).
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://gcr-3qft.onrender.com
